<svg xmlns="http://www.w3.org/2000/svg" width="980" height="945" viewBox="0 0 980 945" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8fd3ff"/></marker>
  </defs>
  <rect width="980" height="945" rx="20" fill="#1b1a20"/>
  <text x="40" y="64" font-size="10.5" fill="#8fd3ff" font-weight="600" letter-spacing="1.7">HYPRLAND</text>
  <rect x="40" y="84" width="204" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="62" y="118" font-size="14.5" fill="#efedf4" font-weight="600">keybind</text>
  <text x="62" y="144" font-size="12" fill="#8a8794">hypr/synopsis.lua binds</text>
  <text x="62" y="163" font-size="12" fill="#8a8794">Super + Grave to the</text>
  <text x="62" y="182" font-size="12" fill="#8a8794">synopsis:toggle event</text>
  <rect x="272" y="84" width="204" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="294" y="118" font-size="14.5" fill="#efedf4" font-weight="600">event socket</text>
  <text x="294" y="144" font-size="12" fill="#8a8794">socket2: custom events,</text>
  <text x="294" y="163" font-size="12" fill="#8a8794">workspacev2, activewindowv2,</text>
  <text x="294" y="182" font-size="12" fill="#8a8794">movewindowv2, closewindow</text>
  <rect x="504" y="84" width="204" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="526" y="118" font-size="14.5" fill="#efedf4" font-weight="600">request socket</text>
  <text x="526" y="144" font-size="12" fill="#8a8794">j/clients in stacking order,</text>
  <text x="526" y="163" font-size="12" fill="#8a8794">j/monitors, j/animations,</text>
  <text x="526" y="182" font-size="12" fill="#8a8794">dispatch and eval</text>
  <rect x="736" y="84" width="204" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="758" y="118" font-size="14.5" fill="#efedf4" font-weight="600">toplevel export</text>
  <text x="758" y="144" font-size="12" fill="#8a8794">each window&#x27;s own buffer;</text>
  <text x="758" y="163" font-size="12" fill="#8a8794">render_unfocused keeps</text>
  <text x="758" y="182" font-size="12" fill="#8a8794">hidden windows painting</text>
