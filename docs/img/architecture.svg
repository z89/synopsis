  <rect x="346.7" y="244.0" width="54.6" height="28" rx="7" fill="#1b1a20"/>
  <text x="374.0" y="261.5" font-size="10.5" fill="#8a8794" text-anchor="middle">events</text>
  <line x1="606" y1="219" x2="606" y2="297" stroke="#8fd3ff" stroke-width="1" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <rect x="572.6" y="244.0" width="66.8" height="28" rx="7" fill="#1b1a20"/>
  <text x="606.0" y="261.5" font-size="10.5" fill="#8a8794" text-anchor="middle">requests</text>
  <line x1="838" y1="219" x2="838" y2="297" stroke="#8fd3ff" stroke-width="1" marker-end="url(#ar)"/>
  <rect x="795.5" y="244.0" width="85.1" height="28" rx="7" fill="#1b1a20"/>
  <text x="838.0" y="261.5" font-size="10.5" fill="#8a8794" text-anchor="middle">live frames</text>
  <rect x="40" y="303" width="900" height="383" rx="16" fill="#232229" stroke="#8fd3ff" stroke-width="1"/>
  <text x="66" y="341" font-size="17" fill="#efedf4" font-weight="600">synopsis</text>
  <text x="158" y="341" font-size="11.5" fill="#8a8794">qs -c synopsis, systemd user service</text>
  <line x1="66" y1="361" x2="914" y2="361" stroke="#35343e" stroke-width="1"/>
  <rect x="66" y="381" width="410" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="88" y="415" font-size="14.5" fill="#efedf4" font-weight="600">Overview</text>
  <text x="88" y="441" font-size="12" fill="#8a8794">one state machine: closed, preparing,</text>
  <text x="88" y="460" font-size="12" fill="#8a8794">opening, open, closing; one progress</text>
  <text x="88" y="479" font-size="12" fill="#8a8794">value drives every flight</text>
  <rect x="504" y="381" width="410" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="526" y="415" font-size="14.5" fill="#efedf4" font-weight="600">HyprState</text>
  <text x="526" y="441" font-size="12" fill="#8a8794">one snapshot per refresh; active</text>
  <text x="526" y="460" font-size="12" fill="#8a8794">workspace and focus fed from events;</text>
  <text x="526" y="479" font-size="12" fill="#8a8794">focus dispatches confirmed</text>
  <rect x="66" y="531" width="410" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="88" y="565" font-size="14.5" fill="#efedf4" font-weight="600">Layout.js</text>
  <text x="88" y="591" font-size="12" fill="#8a8794">gnome row packing for the exposé,</text>
  <text x="88" y="610" font-size="12" fill="#8a8794">the strip row; pure javascript</text>
  <text x="88" y="629" font-size="12" fill="#8a8794">with node tests</text>
  <rect x="504" y="531" width="410" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="526" y="565" font-size="14.5" fill="#efedf4" font-weight="600">Config and Theme</text>
  <text x="526" y="591" font-size="12" fill="#8a8794">~/.config/synopsis/config.json;</text>
  <text x="526" y="610" font-size="12" fill="#8a8794">dms palette, fonts, wallpaper,</text>
  <text x="526" y="629" font-size="12" fill="#8a8794">built-in defaults without dms</text>
  <text x="40" y="758" font-size="10.5" fill="#8fd3ff" font-weight="600" letter-spacing="1.7">ON SCREEN</text>
  <rect x="40" y="776" width="276" height="129" rx="12" fill="#26252e" stroke="#8fd3ff" stroke-width="1"/>
  <text x="62" y="810" font-size="14.5" fill="#efedf4" font-weight="600">backdrop window</text>
  <text x="62" y="836" font-size="12" fill="#8a8794">top layer, sorted beneath</text>
  <text x="62" y="855" font-size="12" fill="#8a8794">the bar: opaque wallpaper</text>
  <text x="62" y="874" font-size="12" fill="#8a8794">after preparing, until closed</text>
  <rect x="352" y="776" width="276" height="129" rx="12" fill="#26252e" stroke="#8fd3ff" stroke-width="1"/>
  <text x="374" y="810" font-size="14.5" fill="#efedf4" font-weight="600">overlay window</text>
  <text x="374" y="836" font-size="12" fill="#8a8794">overlay layer: scrim, workspace</text>
  <text x="374" y="855" font-size="12" fill="#8a8794">strip, exposé and the window</text>
  <text x="374" y="874" font-size="12" fill="#8a8794">thumbnails; keyboard focus</text>
  <rect x="664" y="776" width="276" height="129" rx="12" fill="#26252e" stroke="#35343e" stroke-width="1"/>
  <text x="686" y="810" font-size="14.5" fill="#efedf4" font-weight="600">DankMaterialShell</text>
  <text x="686" y="836" font-size="12" fill="#8a8794">optional: colours, fonts and</text>
  <text x="686" y="855" font-size="12" fill="#8a8794">wallpaper; the bar widget in</text>
  <text x="686" y="874" font-size="12" fill="#8a8794">plugin/ calls ipc toggle</text>
